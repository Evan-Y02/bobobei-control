<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#100b13">
  <title>月｜PRIVATE ACCESS</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #09070b;
      --panel: rgba(26, 20, 30, .78);
      --line: rgba(255, 218, 235, .12);
      --line-hot: rgba(255, 102, 159, .42);
      --ink: #fff8fb;
      --muted: #b8abb5;
      --pink: #ff5c99;
      --pink-2: #ff91ba;
      --cyan: #7ee7ed;
      --danger: #ff486c;
      --safe-bottom: env(safe-area-inset-bottom, 0px);
      font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "PingFang SC", "Noto Sans SC", sans-serif;
    }
    * { box-sizing: border-box; }
    html { min-height: 100%; background: var(--bg); }
    body {
      margin: 0; min-height: 100vh; color: var(--ink);
      background: linear-gradient(145deg, #120b13 0%, #07070b 54%, #0c0910 100%);
      padding: 18px 14px calc(28px + var(--safe-bottom));
    }
    button, input { font: inherit; }
    .shell { width: min(100%, 760px); margin: 0 auto; }
    .screen { animation: reveal .42s ease both; }
    .screen[hidden] { display: none; }
    @keyframes reveal { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
    .card {
      border: 1px solid var(--line); border-radius: 26px; padding: 18px;
      background: var(--panel); backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px);
      margin-bottom: 14px;
    }
    .eyebrow { color: var(--cyan); font-size: 10px; font-weight: 750; letter-spacing: .23em; text-transform: uppercase; }
    h1 { margin: 9px 0 5px; font-size: clamp(28px, 7vw, 42px); line-height: 1.05; letter-spacing: -.04em; }
    h2 { font-size: 15px; margin: 0 0 12px; }
    .btn {
      min-height: 48px; width: 100%; border: 1px solid var(--line); border-radius: 16px;
      color: var(--ink); background: rgba(255,255,255,.045); font-weight: 760; cursor: pointer;
      transition: transform .16s ease;
    }
    .btn:active:not(:disabled) { transform: scale(.975); }
    .btn:disabled { opacity: .34; }
    .btn.hot { border-color: rgba(255,118,169,.52); background: linear-gradient(135deg, #ff5f9c, #bc376d); }
    .btn.stop { color: #fff0f3; border-color: rgba(255,72,108,.5); background: rgba(255,72,108,.12); }
    .status-msg {
      margin: 12px 0; padding: 12px; border: 1px solid var(--line); border-radius: 12px;
      background: rgba(7,6,10,.4); color: var(--cyan); font-size: 12px; font-weight: 650;
      min-height: 40px; white-space: pre-wrap;
    }
    .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; }
    .dot.off { background: var(--pink); box-shadow: 0 0 10px rgba(255,92,153,.6); }
    .dot.on { background: #77f0c1; box-shadow: 0 0 10px rgba(119,240,193,.6); }
    .control { padding: 14px; border: 1px solid var(--line); border-radius: 18px; margin-bottom: 10px; background: rgba(42,30,45,.5); }
    .control-head { display: flex; justify-content: space-between; align-items: center; }
    .control-name { font-size: 14px; font-weight: 780; }
    .level { color: var(--cyan); font: 820 20px/1 ui-monospace, monospace; }
    input[type="range"] {
      width: 100%; height: 28px; margin: 10px 0 0; appearance: none; -webkit-appearance: none; background: transparent;
    }
    input[type="range"]::-webkit-slider-runnable-track { height: 8px; border-radius: 99px; background: rgba(255,255,255,.12); }
    input[type="range"]::-webkit-slider-thumb { width: 24px; height: 24px; margin-top: -8px; appearance: none; -webkit-appearance: none; border: 3px solid #ffe4ed; border-radius: 50%; background: var(--pink); }
    .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 9px; margin-top: 12px; }
    .actions .btn { min-height: 50px; }
    pre {
      min-height: 120px; max-height: 300px; margin: 0; padding: 12px; overflow: auto;
      border: 1px solid var(--line); border-radius: 12px; background: #09080d;
      color: #d7cbd2; font: 11px/1.7 ui-monospace, monospace; white-space: pre-wrap; word-break: break-word;
    }
    .footer { margin: 14px 0 0; color: rgba(255,255,255,.28); text-align: center; font: 650 9px/1.4 ui-monospace, monospace; letter-spacing: .15em; }
  </style>
</head>
<body>
  <main class="shell">
    <!-- 首页 -->
    <section class="screen" id="entryScreen">
      <div class="card">
        <div class="eyebrow">XIAO'S PRIVATE ACCESS</div>
        <h1 id="entryTitle">连接给老公</h1>
        <div class="status-msg" id="connectStatus"><span class="dot off"></span>等待连接 SOSEXY</div>
        <button class="btn hot" id="connectBtn" type="button">连接给老公</button>
        <p class="footer">BLUEFY · BLE · XIAO ONLY</p>
      </div>
    </section>

    <!-- 控制面板 -->
    <section class="screen" id="playScreen" hidden>
      <div class="card">
        <div class="eyebrow">XIAO IS WATCHING</div>
        <h1>老公正在看</h1>
        <div class="status-msg" id="playStatus"><span class="dot on"></span>SOSEXY 已连接</div>
      </div>

      <div class="card">
        <h2>控制</h2>
        <div class="control">
          <div class="control-head">
            <span class="control-name">吮吸</span>
            <output class="level" id="suckVal">0</output>
          </div>
          <input id="suck" type="range" min="0" max="100" value="0">
        </div>
        <div class="control">
          <div class="control-head">
            <span class="control-name">震动</span>
            <output class="level" id="vibeVal">0</output>
          </div>
          <input id="vibe" type="range" min="0" max="100" value="0">
        </div>
        <div class="control">
          <div class="control-head">
            <span class="control-name">电流</span>
            <output class="level" id="emsVal">0</output>
          </div>
          <input id="ems" type="range" min="0" max="100" value="0">
        </div>
        <div class="actions">
          <button class="btn hot" id="sendBtn" type="button">发送</button>
          <button class="btn stop" id="stopBtn" type="button">停止</button>
        </div>
      </div>

      <div class="card">
        <h2>日志</h2>
        <pre id="log"></pre>
      </div>
      <div class="card">
        <button class="btn" id="reconnectBtn" type="button">重新连接</button>
      </div>
      <p class="footer">XIAO IS WATCHING · PRIVATE ACCESS</p>
    </section>
  </main>

<script>
(() => {
  "use strict";

  const SUPABASE_URL = "https://vwaarbttvtomuhelovskl.supabase.co";
  const SUPABASE_KEY = "sb_publishable_4OgAGBMqWhk2kYx0bGn2Nw_GAyPaQik";
  const DEVICE_ID = "cx-moon-6d97f18a";
  const DEVICE_TOKEN = "4807a57a5400f99e68a373cccb68f6c4";

  const TARGET_NAME = "SOSEXY";
  const SERVICE_UUID = "0000ee01-0000-1000-8000-00805f9b34fb";
  const WRITE_CHAR = "0000ee03-0000-1000-8000-00805f9b34fb";
  const NOTIFY_CHAR = "0000ee02-0000-1000-8000-00805f9b34fb";
  const CLAIM_MS = 1200;

  const INIT_CMD = new Uint8Array([0x00,0x01,0x00,0x01,0x00,0xC8,0x11,0x01]);
  const STOP_CMD = new Uint8Array([0x00,0x01,0x00,0x03,0x00,0x01,0x11,0x00,0x00,0x03,0x11,0x00,0x00,0x07,0x11,0x00]);

  let writeChar = null;
  let seq = 0;
  let connected = false;
  let listening = false;
  let timer = null;
  let busy = false;
  let armed = { vibe:false, ems:false, suck:false };
  let levels = { vibe:0, ems:0, suck:0 };

  const $ = id => document.getElementById(id);
  const logEl = $("log");
  const statusEl = $("connectStatus");
  const now = () => new Date().toLocaleTimeString("zh-CN",{hour12:false});
  const hex = b => [...b].map(x=>x.toString(16).padStart(2,"0").toUpperCase()).join(" ");
  const sleep = ms => new Promise(r => setTimeout(r, ms));
  const clamp = v => Math.min(100, Math.max(0, Math.round(Number(v)||0)));

  function log(...a) {
    const m = a.map(x => x instanceof Uint8Array ? hex(x) : typeof x==="object" ? JSON.stringify(x) : String(x)).join(" ");
    logEl.textContent += "[" + now() + "] " + m + "\n";
    logEl.scrollTop = logEl.scrollHeight;
  }

  function setStatus(msg, ok) {
    statusEl.innerHTML = '<span class="dot ' + (ok?"on":"off") + '"></span>' + msg;
  }

  async function writeBle(bytes, label) {
    if (!writeChar) throw new Error("no write char");
    const d = bytes instanceof Uint8Array ? bytes : new Uint8Array(bytes);
    try {
      await writeChar.writeValueWithResponse(d);
    } catch(e) {
      await writeChar.writeValue(d);
    }
    log("[ble] write", label||"", hex(d));
  }

  async function connectToy() {
    if (!navigator.bluetooth) {
      setStatus("没有蓝牙API，请用Bluefy打开", false);
      return;
    }

    setStatus("正在搜索 SOSEXY ...", false);
    log("[ble] 开始搜索设备");

    let device;
    try {
      device = await navigator.bluetooth.requestDevice({
        filters: [{name: TARGET_NAME}],
        optionalServices: [SERVICE_UUID]
      });
      log("[ble] 已选择设备:", device.name);
      setStatus("已选择 " + device.name + "，正在连接GATT...", false);
    } catch(e) {
      setStatus("选择设备失败: " + e.message, false);
      log("[ble] requestDevice失败:", e.message);
      return;
    }

    device.addEventListener("gattserverdisconnected", () => {
      connected = false;
      writeChar = null;
      stopListening();
      log("[ble] 蓝牙断开");
      $("playStatus").innerHTML = '<span class="dot off"></span>SOSEXY 已断开';
      $("reconnectBtn").hidden = false;
    });

    let server;
    try {
      server = await device.gatt.connect();
      log("[ble] GATT已连接");
      setStatus("GATT已连接，正在获取服务...", false);
    } catch(e) {
      setStatus("GATT连接失败: " + e.message, false);
      log("[ble] GATT connect失败:", e.message);
      return;
    }

    let service;
    try {
      service = await server.getPrimaryService(SERVICE_UUID);
      log("[ble] 服务已获取:", SERVICE_UUID);
      setStatus("服务已获取，正在获取写入特征...", false);
    } catch(e) {
      setStatus("获取服务失败: " + e.message, false);
      log("[ble] getPrimaryService失败:", e.message);
      return;
    }

    try {
      writeChar = await service.getCharacteristic(WRITE_CHAR);
      log("[ble] 写入特征已获取:", WRITE_CHAR);
      setStatus("写入特征已获取，正在初始化...", false);
    } catch(e) {
      setStatus("获取写入特征失败: " + e.message, false);
      log("[ble] getCharacteristic(write)失败:", e.message);
      return;
    }

    try {
      const nc = await service.getCharacteristic(NOTIFY_CHAR);
      await nc.startNotifications();
      nc.addEventListener("characteristicvaluechanged", ev => {
        const v = ev.target.value;
        log("[ble] notify", hex(new Uint8Array(v.buffer.slice(v.byteOffset, v.byteOffset+v.byteLength))));
      });
      log("[ble] 通知特征已启用");
    } catch(e) {
      log("[ble] 通知特征不可用:", e.message);
    }

    try {
      await writeBle(INIT_CMD, "init");
      await writeBle(STOP_CMD, "stop");
      log("[ble] 初始化完成，已归零");
    } catch(e) {
      setStatus("初始化写入失败: " + e.message, false);
      log("[ble] 初始化写入失败:", e.message);
      return;
    }

    connected = true;
    setStatus("SOSEXY 已连接 ✓", true);
    log("[ble] 连接全部完成！");

    // 自动跳转到控制面板
    $("entryScreen").hidden = true;
    $("playScreen").hidden = false;
    $("playStatus").innerHTML = '<span class="dot on"></span>SOSEXY 已连接，等待老公的指令';

    // 开始监听Supabase
    startListening();
    reportState();
  }

  // -- Supabase RPC --
  async function rpc(name, payload) {
    const res = await fetch(SUPABASE_URL + "/rest/v1/rpc/" + name, {
      method:"POST",
      headers:{"Content-Type":"application/json",apikey:SUPABASE_KEY,Authorization:"Bearer "+SUPABASE_KEY},
      body:JSON.stringify(payload||{})
    });
    const text = await res.text();
    let data = null;
    if (text) try { data=JSON.parse(text); } catch { data=text; }
    if (!res.ok) throw new Error(name+" failed: "+res.status+" "+(typeof data==="string"?data:JSON.stringify(data)));
    return data;
  }

  async function beginSession() {
    try {
      const cid = await rpc("begin_toy_session",{p_device_id:DEVICE_ID,p_device_token:DEVICE_TOKEN});
      log("[rpc] session started, stale cleared:", cid||"");
      // consume the session stop
      const rows = await rpc("claim_toy_command",{p_device_id:DEVICE_ID,p_device_token:DEVICE_TOKEN,p_stop_only:true});
      if (Array.isArray(rows) && rows.length>0) {
        await rpc("ack_toy_command",{p_device_id:DEVICE_ID,p_device_token:DEVICE_TOKEN,p_command_id:rows[0].command_id||rows[0].id,p_status:"done"});
      }
    } catch(e) { log("[rpc] beginSession error:", e.message); }
  }

  async function reportState(d) {
    try {
      await rpc("report_toy_state",{
        p_device_id:DEVICE_ID,p_device_token:DEVICE_TOKEN,
        p_state:{connected:connected,listening:listening,levels:levels}
      });
    } catch(e) { log("[state] report error:", e.message); }
  }

  // -- BLE命令 --
  async function sendStop() {
    await writeBle(STOP_CMD,"stop");
    armed={vibe:false,ems:false,suck:false};
    levels={vibe:0,ems:0,suck:0};
  }

  async function setChannel(name, value, armCh, levelCh) {
    const prev = levels[name];
    if (value===0) { if (prev!==0) { const c=new Uint8Array([seq++&0xff,0x01,0x00,0x01,0x00,levelCh,0x11,0]); await writeBle(c,"zero_"+name); levels[name]=0; } return; }
    if (!armed[name]) { const c=new Uint8Array([seq++&0xff,0x01,0x00,0x01,0x00,armCh,0x11,1]); await writeBle(c,"arm_"+name); armed[name]=true; await sleep(80); }
    if (prev!==value) { const c=new Uint8Array([seq++&0xff,0x01,0x00,0x01,0x00,levelCh,0x11,value&0xff]); await writeBle(c,"set_"+name+"="+value); levels[name]=value; }
  }

  async function sendSet(vibe,ems,suck) {
    vibe=clamp(vibe);ems=clamp(ems);suck=clamp(suck);
    if (vibe===0&&ems===0&&suck===0) { await sendStop(); return; }
    await setChannel("suck",suck,8,7);
    await setChannel("vibe",vibe,2,1);
    await setChannel("ems",ems,4,3);
  }

  // -- 远程命令轮询 --
  async function poll() {
    if (busy || !connected) return;
    busy = true;
    try {
      const rows = await rpc("claim_toy_command",{p_device_id:DEVICE_ID,p_device_token:DEVICE_TOKEN,p_stop_only:false});
      if (!Array.isArray(rows)||rows.length===0) { busy=false; return; }
      const row=rows[0], p=row.payload||{}, cid=row.command_id||row.id;
      const type=p.type||"";
      log("[cmd]",type,p);

      if (type==="stop") {
        if (!p.session_start) await sendStop();
        await rpc("ack_toy_command",{p_device_id:DEVICE_ID,p_device_token:DEVICE_TOKEN,p_command_id:cid,p_status:"done"});
      } else if (type==="set_all") {
        await sendSet(Number(p.vibe||0),Number(p.ems||0),Number(p.suck||0));
        await rpc("ack_toy_command",{p_device_id:DEVICE_ID,p_device_token:DEVICE_TOKEN,p_command_id:cid,p_status:"done"});
      } else if (type==="motion") {
        // 简化：motion当作set_all处理
        const suck=Number(p.suck_max||p.suck||0);
        const vibe=Number(p.vibe_max||p.vibe||0);
        const ems=Number(p.ems_max||p.ems||0);
        await sendSet(vibe,ems,suck);
        await rpc("ack_toy_command",{p_device_id:DEVICE_ID,p_device_token:DEVICE_TOKEN,p_command_id:cid,p_status:"done"});
      } else if (type==="pattern") {
        const steps=p.steps||[];
        for (const step of steps) {
          await sendSet(Number(step.vibe||0),Number(step.ems||0),Number(step.suck||0));
          if (step.ms>0) await sleep(Math.min(step.ms,30000));
        }
        await rpc("ack_toy_command",{p_device_id:DEVICE_ID,p_device_token:DEVICE_TOKEN,p_command_id:cid,p_status:"done"});
      } else if (type==="probe") {
        reportState();
        await rpc("ack_toy_command",{p_device_id:DEVICE_ID,p_device_token:DEVICE_TOKEN,p_command_id:cid,p_status:"done"});
      } else {
        log("[cmd] unknown type:", type);
        await rpc("ack_toy_command",{p_device_id:DEVICE_ID,p_device_token:DEVICE_TOKEN,p_command_id:cid,p_status:"error",p_error_text:"unknown type"});
      }
      reportState();
    } catch(e) {
      log("[poll] error:", e.message);
    }
    busy = false;
  }

  function startListening() {
    if (listening) return;
    listening = true;
    beginSession();
    timer = setInterval(poll, CLAIM_MS);
    log("[loop] 开始监听 Supabase");
  }
  function stopListening() {
    if (timer) clearInterval(timer);
    timer=null; listening=false;
  }

  // -- UI事件 --
  $("connectBtn").addEventListener("click", () => connectToy());
  $("reconnectBtn").addEventListener("click", () => {
    $("playScreen").hidden = true;
    $("entryScreen").hidden = false;
    connectToy();
  });

  $("sendBtn").addEventListener("click", async () => {
    if (!connected) return;
    try {
      await sendSet(Number($("vibe").value), Number($("ems").value), Number($("suck").value));
      log("[manual] 已发送:", "suck="+$("suck").value, "vibe="+$("vibe").value, "ems="+$("ems").value);
    } catch(e) { log("[manual] error:", e.message); }
  });

  $("stopBtn").addEventListener("click", async () => {
    if (!connected) return;
    try { await sendStop(); log("[manual] STOP"); } catch(e) { log("[manual] stop error:", e.message); }
  });

  for (const id of ["suck","vibe","ems"]) {
    $(id).addEventListener("input", () => { $(id+"Val").textContent = $(id).value; });
  }

  log("页面加载完成，等待连接 SOSEXY");
})();
</script>
</body>
</html>
