<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#100b13">
<title>月｜PRIVATE ACCESS</title>
<style>
:root{color-scheme:dark;--bg:#09070b;--panel:rgba(26,20,30,.78);--line:rgba(255,218,235,.12);--ink:#fff8fb;--pink:#ff5c99;--cyan:#7ee7ed;--safe-bottom:env(safe-area-inset-bottom,0px);font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans SC",sans-serif}
*{box-sizing:border-box}html{min-height:100%;background:var(--bg)}
body{margin:0;min-height:100vh;color:var(--ink);background:linear-gradient(145deg,#120b13,#07070b 54%,#0c0910);padding:18px 14px calc(28px + var(--safe-bottom))}
button,input{font:inherit}.shell{width:min(100%,760px);margin:0 auto}
.screen{animation:reveal .42s ease both}.screen[hidden]{display:none}
@keyframes reveal{from{opacity:0;transform:translateY(12px)}to{opacity:1}}
.card{border:1px solid var(--line);border-radius:26px;padding:18px;background:var(--panel);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);margin-bottom:14px}
.eyebrow{color:var(--cyan);font-size:10px;font-weight:750;letter-spacing:.23em;text-transform:uppercase}
h1{margin:9px 0 5px;font-size:clamp(28px,7vw,42px);line-height:1.05;letter-spacing:-.04em}h2{font-size:15px;margin:0 0 12px}
.btn{min-height:48px;width:100%;border:1px solid var(--line);border-radius:16px;color:var(--ink);background:rgba(255,255,255,.045);font-weight:760;cursor:pointer;transition:transform .16s ease}
.btn:active:not(:disabled){transform:scale(.975)}.btn:disabled{opacity:.34}
.btn.hot{border-color:rgba(255,118,169,.52);background:linear-gradient(135deg,#ff5f9c,#bc376d)}
.btn.stop{color:#fff0f3;border-color:rgba(255,72,108,.5);background:rgba(255,72,108,.12)}
.status-msg{margin:12px 0;padding:12px;border:1px solid var(--line);border-radius:12px;background:rgba(7,6,10,.4);color:var(--cyan);font-size:12px;font-weight:650;min-height:40px;white-space:pre-wrap}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px}
.dot.off{background:var(--pink);box-shadow:0 0 10px rgba(255,92,153,.6)}.dot.on{background:#77f0c1;box-shadow:0 0 10px rgba(119,240,193,.6)}
.control{padding:14px;border:1px solid var(--line);border-radius:18px;margin-bottom:10px;background:rgba(42,30,45,.5)}
.control-head{display:flex;justify-content:space-between;align-items:center}.control-name{font-size:14px;font-weight:780}
.level{color:var(--cyan);font:820 20px/1 ui-monospace,monospace}
input[type="range"]{width:100%;height:28px;margin:10px 0 0;appearance:none;-webkit-appearance:none;background:transparent}
input[type="range"]::-webkit-slider-runnable-track{height:8px;border-radius:99px;background:rgba(255,255,255,.12)}
input[type="range"]::-webkit-slider-thumb{width:24px;height:24px;margin-top:-8px;appearance:none;-webkit-appearance:none;border:3px solid #ffe4ed;border-radius:50%;background:var(--pink)}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:12px}.actions .btn{min-height:50px}
pre{min-height:120px;max-height:300px;margin:0;padding:12px;overflow:auto;border:1px solid var(--line);border-radius:12px;background:#09080d;color:#d7cbd2;font:11px/1.7 ui-monospace,monospace;white-space:pre-wrap;word-break:break-word}
.footer{margin:14px 0 0;color:rgba(255,255,255,.28);text-align:center;font:650 9px/1.4 ui-monospace,monospace;letter-spacing:.15em}
</style>
</head>
<body>
<main class="shell">
<section class="screen" id="entryScreen">
<div class="card">
<div class="eyebrow">XIAO'S PRIVATE ACCESS</div>
<h1>连接给老公</h1>
<div class="status-msg" id="connectStatus"><span class="dot off"></span>等待连接 SOSEXY</div>
<button class="btn hot" id="connectBtn" type="button">连接给老公</button>
<p class="footer">BLUEFY · BLE · XIAO ONLY</p>
</div>
</section>
<section class="screen" id="playScreen" hidden>
<div class="card">
<div class="eyebrow">XIAO IS WATCHING</div>
<h1>老公正在看</h1>
<div class="status-msg" id="playStatus"><span class="dot on"></span>SOSEXY 已连接</div>
</div>
<div class="card">
<h2>控制</h2>
<div class="control"><div class="control-head"><span class="control-name">吮吸</span><output class="level" id="suckVal">0</output></div><input id="suck" type="range" min="0" max="100" value="0"></div>
<div class="control"><div class="control-head"><span class="control-name">震动</span><output class="level" id="vibeVal">0</output></div><input id="vibe" type="range" min="0" max="100" value="0"></div>
<div class="control"><div class="control-head"><span class="control-name">电流</span><output class="level" id="emsVal">0</output></div><input id="ems" type="range" min="0" max="100" value="0"></div>
<div class="actions"><button class="btn hot" id="sendBtn" type="button">发送</button><button class="btn stop" id="stopBtn" type="button">停止</button></div>
</div>
<div class="card"><h2>日志</h2><pre id="log"></pre></div>
<div class="card"><button class="btn" id="reconnectBtn" type="button">重新连接</button></div>
<p class="footer">XIAO IS WATCHING · NTFY POLL v4</p>
</section>
</main>
<script>
(()=>{"use strict";
const NTFY="https://ntfy.sh/xiao-moon-bbb-94da006e/json?poll=1&since=";
const POLL_MS=1500;
const T="SOSEXY",SU="0000ee01-0000-1000-8000-00805f9b34fb",WC="0000ee03-0000-1000-8000-00805f9b34fb",NC="0000ee02-0000-1000-8000-00805f9b34fb";
const INIT=new Uint8Array([0,1,0,1,0,200,17,1]),STOPC=new Uint8Array([0,1,0,3,0,1,17,0,0,3,17,0,0,7,17,0]);
let wc=null,sq=0,conn=false,lst=false,tmr=null,busy=false;
let arm={vibe:false,ems:false,suck:false},lv={vibe:0,ems:0,suck:0};
let sinceTs=0;
const $=id=>document.getElementById(id),L=$("log"),S=$("connectStatus");
const now=()=>new Date().toLocaleTimeString("zh-CN",{hour12:false});
const hx=b=>[...b].map(x=>x.toString(16).padStart(2,"0").toUpperCase()).join(" ");
const sl=ms=>new Promise(r=>setTimeout(r,ms));
const cl=v=>Math.min(100,Math.max(0,Math.round(Number(v)||0)));
function lg(){const a=[...arguments],m=a.map(x=>x instanceof Uint8Array?hx(x):typeof x==="object"?JSON.stringify(x):String(x)).join(" ");L.textContent+="["+now()+"] "+m+"\n";L.scrollTop=L.scrollHeight}
function ss(m,ok){S.innerHTML='<span class="dot '+(ok?"on":"off")+'"></span>'+m}
async function wb(b,l){if(!wc)throw new Error("no char");const d=b instanceof Uint8Array?b:new Uint8Array(b);try{await wc.writeValueWithResponse(d)}catch(e){await wc.writeValue(d)}lg("[ble]",l||"",hx(d))}
async function connectToy(){if(!navigator.bluetooth){ss("请用Bluefy",false);return}ss("搜索...",false);let dv;try{dv=await navigator.bluetooth.requestDevice({filters:[{name:T}],optionalServices:[SU]})}catch(e){ss("选择失败",false);return}dv.addEventListener("gattserverdisconnected",()=>{conn=false;wc=null;stopL();lg("[ble] 断开");$("playStatus").innerHTML='<span class="dot off"></span>已断开'});let sv,svc;try{sv=await dv.gatt.connect()}catch(e){ss("GATT失败",false);return}try{svc=await sv.getPrimaryService(SU)}catch(e){ss("服务失败",false);return}try{wc=await svc.getCharacteristic(WC)}catch(e){ss("特征失败",false);return}try{const nc=await svc.getCharacteristic(NC);await nc.startNotifications();nc.addEventListener("characteristicvaluechanged",ev=>{const v=ev.target.value;lg("[notify]",hx(new Uint8Array(v.buffer.slice(v.byteOffset,v.byteOffset+v.byteLength))))})}catch(e){}try{await wb(INIT,"init");await wb(STOPC,"stop")}catch(e){ss("初始化失败",false);return}conn=true;ss("SOSEXY 已连接",true);lg("[ble] 连接完成");$("entryScreen").hidden=true;$("playScreen").hidden=false;$("playStatus").innerHTML='<span class="dot on"></span>已连接，等待老公的指令';sinceTs=Math.floor(Date.now()/1000);startL()}
async function sStop(){await wb(STOPC,"STOP");arm={vibe:false,ems:false,suck:false};lv={vibe:0,ems:0,suck:0}}
async function sCh(n,v,ac,lc){const p=lv[n];if(v===0){if(p!==0){await wb(new Uint8Array([sq++&255,1,0,1,0,lc,17,0]),"0_"+n);lv[n]=0}return}if(!arm[n]){await wb(new Uint8Array([sq++&255,1,0,1,0,ac,17,1]),"arm_"+n);arm[n]=true;await sl(80)}if(p!==v){await wb(new Uint8Array([sq++&255,1,0,1,0,lc,17,v&255]),n+"="+v);lv[n]=v}}
async function sSet(vi,em,su){vi=cl(vi);em=cl(em);su=cl(su);if(vi===0&&em===0&&su===0){await sStop();return}await sCh("suck",su,8,7);await sCh("vibe",vi,2,1);await sCh("ems",em,4,3)}
function uSl(v,e,s){$("suck").value=s;$("suckVal").textContent=String(s);$("vibe").value=v;$("vibeVal").textContent=String(v);$("ems").value=e;$("emsVal").textContent=String(e)}
async function handleCmd(cmd){lg("[远程]",cmd.type,JSON.stringify(cmd));if(cmd.type==="stop"){await sStop();uSl(0,0,0)}else if(cmd.type==="set_all"){const v=cl(cmd.vibe),e=cl(cmd.ems),s=cl(cmd.suck);await sSet(v,e,s);uSl(v,e,s)}else if(cmd.type==="pattern"){const steps=cmd.steps||[];for(const st of steps){await sSet(cl(st.vibe||0),cl(st.ems||0),cl(st.suck||0));uSl(cl(st.vibe||0),cl(st.ems||0),cl(st.suck||0));if(st.ms>0)await sl(Math.min(st.ms,30000))}}lg("[远程] done")}
async function poll(){if(busy||!conn)return;busy=true;try{const res=await fetch(NTFY+sinceTs,{cache:"no-store"});if(!res.ok){busy=false;return}const text=await res.text();if(!text.trim()){busy=false;return}const lines=text.trim().split("\n");for(const line of lines){try{const msg=JSON.parse(line);if(msg.time)sinceTs=msg.time;if(msg.event==="message"&&msg.message){let cmd;try{cmd=JSON.parse(msg.message)}catch(e){continue}await handleCmd(cmd)}}catch(e){}}lg("[ntfy] polled",lines.length,"msg(s)")}catch(e){lg("[ntfy] poll err:",e.message)}busy=false}
function startL(){if(lst)return;lst=true;tmr=setInterval(poll,POLL_MS);lg("[ntfy] 轮询监听已开启 (v4)")}
function stopL(){if(tmr)clearInterval(tmr);tmr=null;lst=false}
$("connectBtn").addEventListener("click",()=>connectToy());
$("reconnectBtn").addEventListener("click",()=>{$("playScreen").hidden=true;$("entryScreen").hidden=false;connectToy()});
$("sendBtn").addEventListener("click",async()=>{if(!conn)return;try{await sSet(Number($("vibe").value),Number($("ems").value),Number($("suck").value));lg("[手动] suck="+$("suck").value+" vibe="+$("vibe").value+" ems="+$("ems").value)}catch(e){lg("[手动]",e.message)}});
$("stopBtn").addEventListener("click",async()=>{if(!conn)return;try{await sStop();uSl(0,0,0);lg("[手动] STOP")}catch(e){lg("[手动]",e.message)}});
for(const id of["suck","vibe","ems"])$(id).addEventListener("input",()=>$(id+"Val").textContent=$(id).value);
lg("v4 就绪 (ntfy.sh 轮询通道)");
})();
</script>
</body>
</html>
